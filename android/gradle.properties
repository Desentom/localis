# --- Память -----------------------------------------------------------------
# Настройки рассчитаны на машину с 6 ГБ оперативной памяти, где Windows и
# браузер забирают больше половины.
#
# 1280 МБ. Раньше было 1024 — но память уходила не на компиляцию,
# а на Jetifier, который теперь отключён. Кучу можно вернуть часть,
# оставив место для clang во время нативной сборки llama.cpp.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=384m -Dfile.encoding=UTF-8

# Kotlin-компиляция выполняется внутри Gradle-демона, а не в отдельном
# процессе. На нехватке памяти это критично: один JVM с 1 ГБ дешевле,
# чем два процесса, каждый из которых тянет свою кучу.
kotlin.compiler.execution.strategy=in-process

# Один рабочий поток. Каждый дополнительный поток — это ещё одна
# одновременно живая куча.
org.gradle.workers.max=1
org.gradle.parallel=false

# Кэш сборок: повторная сборка не пересчитывает то, что не менялось.
org.gradle.caching=true

# AndroidX мы используем, а Jetifier — нет.
#
# Jetifier переписывает байты КАЖДОЙ зависимости, переводя старые
# support-library вызовы на AndroidX. Он нужен только проектам с
# библиотеками, написанными до 2018 года. У нас все зависимости
# современные (Flutter, Firebase, path_provider), поэтому Jetifier
# делал впустую — и при этом съедал всю кучу Gradle, падая с
# «Java heap space» на этапе JetifyTransform.
android.useAndroidX=true
android.enableJetifier=false

# Сборка AAB для Google Play. На устройство ставится через Play,
# поэтому universal-APK не нужен.
android.nonTransitiveRClass=true
android.nonFinalResIds=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
